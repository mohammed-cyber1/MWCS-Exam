const select = document.getElementById('examSelect');
const frame = document.getElementById('examFrame');
const info = document.getElementById('examInfo');
exams.forEach((exam,i)=>{
  const option=document.createElement('option');
  option.value=String(i);
  option.textContent=exam.title;
  select.appendChild(option);
});
function openExam(){
  const exam=exams[Number(select.value)];
  const binary=atob(exam.data);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const html=new TextDecoder('utf-8').decode(bytes);
  frame.srcdoc=html;
  info.textContent='الامتحان المحدد: '+exam.title+' — يمكنك تغييره من القائمة في أي وقت.';
}
select.addEventListener('change',openExam);
openExam();
