<script>
const weeks=[[["Which NIST characteristic lets consumers provision computing capabilities automatically without human interaction with the provider?", ["Broad network access", "On-demand self-service", "Measured service", "Rapid elasticity"], 1, "On-demand self-service يتيح للمستهلك توفير قدرات الحوسبة تلقائيًا دون تفاعل بشري مع المزود."], ["A provider pools thousands of computers and dynamically assigns resources to multiple consumers. Which characteristic is described?", ["Resource pooling", "Measured service", "Broad network access", "Pay per use"], 0, "Resource pooling هو تجميع الموارد وتخصيصها ديناميكيًا لخدمة عدة مستهلكين."], ["Resources increase during a demand spike and are released when demand decreases. Which characteristic applies?", ["Measured service", "Multi-tenancy", "Rapid elasticity", "Broad network access"], 2, "Rapid elasticity تعني زيادة الموارد بسرعة ثم تحريرها عند انخفاض الطلب."], ["Which characteristic uses metering to monitor, control, and report resource usage?", ["On-demand self-service", "Measured service", "Resource pooling", "Ubiquitous network access"], 1, "Measured service تعتمد على قياس الاستخدام ومراقبته والتحكم به وإعداد التقارير."], ["A consumer is billed for the precise number of resources actually consumed. Which characteristic is emphasized?", ["Pay per use", "Multi-tenancy", "Broad network access", "Resource pooling"], 0, "Pay per Use تعني محاسبة المستهلك على الموارد التي استهلكها فعليًا."], ["A service is shared among users at some level of its technology stack rather than dedicated to one consumer. What is this?", ["Elasticity", "Multi-tenancy", "Measured service", "On-demand self-service"], 1, "Multi-tenancy تعني مشاركة الخدمة أو جزء من مكدس التقنية بين عدة مستخدمين."], ["A service is accessible over a common network, typically the Internet for public cloud. Which characteristic?", ["Broad network access", "Resource pooling", "Pay per use", "Rapid elasticity"], 0, "Broad network access تعني إتاحة قدرات الخدمة عبر الشبكة باستخدام آليات وصول قياسية."], ["Which characteristic supports heterogeneous thin or thick client platforms such as phones and laptops?", ["Measured service", "Broad network access", "On-demand self-service", "Rapid elasticity"], 1, "Broad network access يدعم الوصول من منصات عملاء مختلفة مثل الهواتف والحواسيب."], ["A consumer provisions server time automatically through a service interface without provider interaction. Which characteristic?", ["Measured service", "On-demand self-service", "Resource pooling", "Multi-tenancy"], 1, "المستهلك يوفّر الموارد بنفسه تلقائيًا، وهذا هو On-demand self-service."], ["Which statement distinguishes rapid elasticity from measured service?", ["Elasticity scales resources; measured service meters and reports usage", "Elasticity bills users; measured service shares hardware", "Elasticity provides network access; measured service provides applications", "They describe the same capability"], 0, "Rapid elasticity تتعلق بتغيير حجم الموارد بسرعة، بينما Measured service تتعلق بقياس الاستخدام والإبلاغ عنه."], ["Which service model lets consumers provision processing, storage, networks, and other fundamental computing resources?", ["SaaS", "PaaS", "IaaS", "FaaS"], 2, "IaaS يتيح توفير موارد الحوسبة الأساسية مثل المعالجة والتخزين والشبكات."], ["In IaaS, which components does the consumer control?", ["Underlying physical data center", "Operating systems, storage, and deployed applications", "All provider hardware and hypervisors", "Only provider application code"], 1, "في IaaS لا يتحكم العميل بالبنية الأساسية، لكنه يتحكم بأنظمة التشغيل والتخزين والتطبيقات المنشورة."], ["A customer selects a VM size, chooses an operating system, and deploys its own software. Which model?", ["IaaS", "PaaS", "SaaS", "Community Cloud"], 0, "اختيار حجم VM ونظام التشغيل ونشر البرمجيات من أمثلة IaaS."], ["Which is an advantage of IaaS identified in the handout?", ["Eliminates all customer security duties", "Converts capital expenditure into operational expenditure", "Solves every legacy migration issue", "Always costs less for constant 24/7 demand"], 1, "IaaS يحول نفقات العميل من استثمار رأسمالي إلى نفقات تشغيلية."], ["Why might a constant-demand 24/7 service be more expensive on IaaS cloud?", ["Cost benefits are most pronounced for short-term or bursty applications", "IaaS cannot provide storage", "Customer must own the provider data center", "IaaS does not support VMs"], 0, "فوائد التكلفة في IaaS تظهر بوضوح أكبر مع التطبيقات قصيرة الأجل أو ذات الطلب المتقطع."], ["Which model lets consumers deploy applications using provider-supported languages, libraries, services, and tools?", ["IaaS", "PaaS", "SaaS", "Public Cloud"], 1, "PaaS يسمح بنشر تطبيقات باستخدام اللغات والأدوات التي يدعمها المزود."], ["In PaaS, who manages the underlying network, servers, operating systems, and storage?", ["Consumer", "Application end user", "Cloud provider", "Community committee"], 2, "في PaaS يدير المزود البنية التحتية الأساسية بما فيها الشبكة والخوادم وأنظمة التشغيل والتخزين."], ["Why is PaaS particularly challenging to secure according to the handout?", ["Customer has no control over deployed applications", "Security responsibilities are widely distributed between provider and consumer", "It requires dedicated physical resources", "It does not support application development"], 1, "توزيع مسؤوليات الأمن بين المزود والمستهلك بصورة أوسع يجعل PaaS أكثر تحديًا."], ["An application must be significantly re-coded when moving between PaaS providers because APIs and frameworks differ. Which issue?", ["Resource pooling", "Vendor lock-in", "Rapid elasticity", "Measured service"], 1, "Vendor lock-in يحدث بسبب الاعتماد على تقنيات مزود يصعب نقلها إلى مزود آخر."], ["Which service model provides provider applications through a thin client such as a web browser?", ["IaaS", "PaaS", "SaaS", "FaaS"], 2, "SaaS يتيح استخدام تطبيقات المزود عبر أجهزة العميل ومنها متصفح الويب."], ["In SaaS, what may the consumer still configure?", ["Physical servers", "Limited user-specific application settings", "Underlying storage arrays", "Hypervisor kernel"], 1, "قد يحتفظ المستهلك بإمكانية ضبط إعدادات محدودة خاصة بالمستخدم داخل التطبيق."], ["What generally happens to customer control over the underlying technology stack from IaaS to PaaS to SaaS?", ["It decreases", "It increases", "It remains identical", "It transfers entirely to the customer"], 0, "كلما انتقلنا من IaaS إلى PaaS ثم SaaS يرتفع التجريد وتقل سيطرة العميل على المكدس التقني."], ["Which model is described as a form of serverless technology and an evolution of PaaS?", ["IaaS", "FaaS", "SaaS", "Private Cloud"], 1, "الملزمة تصف FaaS بأنه شكل من serverless technology وتطور لنموذج PaaS."], ["A cloud function is event-triggered and time-limited, without an overall process running continuously. Which model?", ["FaaS", "IaaS", "SaaS", "Private Cloud"], 0, "FaaS يوفر وظائف تستجيب للأحداث وتكون محددة بزمن."], ["Which deployment model is provisioned for open use by the general public?", ["Private Cloud", "Community Cloud", "Public Cloud", "Hybrid Cloud"], 2, "Public Cloud مخصص للاستخدام المفتوح من قبل عامة الجمهور."], ["Infrastructure is provisioned exclusively for one organization, possibly containing multiple business units. Which model?", ["Public Cloud", "Private Cloud", "Community Cloud", "Hybrid Cloud"], 1, "Private Cloud مخصص للاستخدام الحصري لمنظمة واحدة قد تضم عدة وحدات."], ["Several organizations share infrastructure because of common mission, security, policy, or compliance concerns. Which model?", ["Community Cloud", "Public Cloud", "Private Cloud", "IaaS"], 0, "Community Cloud يخدم مجتمعًا من المنظمات ذات الاهتمامات والمتطلبات المشتركة."], ["Which statement about hybrid cloud is correct?", ["It must always include a public cloud", "It combines distinct cloud infrastructures that remain unique entities", "It is exclusive to one organization", "It cannot support portability"], 1, "Hybrid Cloud يجمع بنيتين أو أكثر تبقيان ككيانات مستقلة ومرتبطتين بتقنية تتيح قابلية النقل."], ["A combination of private and community clouds is deployed together. How is it classified?", ["Cannot be hybrid", "Must be public", "Hybrid cloud", "SaaS deployment"], 2, "الملزمة تنص على أن الجمع بين Private وCommunity يعد Hybrid Cloud حتى دون Public Cloud."], ["Which deployment model generally provides the greatest security control to the consumer?", ["Public Cloud", "Hybrid Cloud", "Community Cloud", "Private Cloud"], 3, "ترتيب تناقص التحكم يبدأ بـ Private ثم Community ثم Hybrid ثم Public."], ["Which model has the lowest consumer security control in the stated order?", ["Public Cloud", "Private Cloud", "Community Cloud", "Hybrid Cloud"], 0, "Public Cloud يأتي أخيرًا في ترتيب مقدار التحكم الأمني المتاح للمستهلك."], ["Which is a public cloud strength in the deployment table?", ["Complete consumer control", "Provider security resources and wide visibility of incidents", "No multitenancy", "No compliance concerns"], 1, "من نقاط قوة Public Cloud توفر موارد أمنية لدى المزود واتساع رؤيته للحوادث."], ["Which weakness is associated with public cloud?", ["Multitenancy and compliance concerns", "Central community governance body", "Limited scaling compared with public cloud", "Community security resources"], 0, "الجدول يذكر Multitenancy وCompliance concerns ضمن نقاط ضعف Public Cloud."], ["Which model requires a central body or committee to manage the service?", ["Private Cloud", "Public Cloud", "Community Cloud", "Hybrid Cloud"], 2, "Community Cloud يحتاج إلى هيئة أو لجنة مركزية لإدارة الخدمة."], ["Which model has a closed set of users and shared security requirements?", ["Public Cloud", "Community Cloud", "Hybrid Cloud", "SaaS"], 1, "Community Cloud يقتصر على مجتمع مغلق ويمكنه تحديد متطلبات أمن مشتركة."], ["Which is a private cloud weakness?", ["Multitenancy across unrelated customers", "Initial investment and providing its own security resources", "Trusting other community members", "Open public use"], 1, "Private Cloud يتطلب الاستثمار الأولي وتوفير موارد الأمن الخاصة بالمنظمة."], ["Which model is described as 'worst of both worlds' because services must be secured on-cloud and on-premises?", ["Hybrid Cloud", "Private Cloud", "Community Cloud", "Public Cloud"], 0, "Hybrid Cloud يجمع تعقيدات تأمين الخدمات السحابية والمحلية."], ["Which weakness is listed for hybrid cloud?", ["Cannot keep sensitive data on-premises", "Complexity and multitenancy", "Exclusive use by one organization", "No need to secure on-premises services"], 1, "من نقاط ضعف Hybrid Cloud التعقيد وMultitenancy والحاجة لتأمين البيئتين."], ["A company keeps sensitive data on-premises while using public cloud where appropriate. Which model supports this?", ["Public Cloud", "Community Cloud", "Hybrid Cloud", "SaaS"], 2, "من نقاط قوة Hybrid Cloud الاحتفاظ بالبيانات الحساسة محليًا واستخدام Public Cloud عند الحاجة."], ["Who secures physical infrastructure such as biometric access controls and security guards?", ["Cloud provider", "Customer", "End user", "Application developer"], 0, "مزود الخدمة مسؤول عن أمن البنية التحتية المادية وإجراءات حماية المنشآت."], ["In IaaS, network security is described as:", ["Entirely customer responsibility", "Entirely provider responsibility", "Shared across networking layers", "Not a security responsibility"], 2, "أمن الشبكة في IaaS مسؤولية مشتركة بين المزود والعميل عبر طبقات الشبكة."], ["Who is typically responsible for operating system security in IaaS?", ["Cloud provider", "Customer", "Network carrier", "Data center guard"], 1, "أمن نظام التشغيل يكون عادةً مسؤولية العميل في IaaS."], ["In PaaS and SaaS, operating system security is typically the responsibility of:", ["Customer", "End user", "Cloud provider", "Application auditor"], 2, "الملزمة توضح أن أمن نظام التشغيل يكون عادةً من مسؤولية المزود في PaaS وSaaS."], ["What rule of thumb does the handout provide if a customer can 'break' a component?", ["Provider always secures it", "Customer usually secures it", "No party is responsible", "Network operator secures it"], 1, "إذا كان العميل يستطيع التحكم بمكوّن أو تغييره، فعادةً يكون مسؤولًا عن تأمينه."], ["In PaaS, which middleware security task may remain the customer's responsibility?", ["Managing physical data center", "Security-relevant settings such as encryption", "Replacing provider servers", "Maintaining security guards"], 1, "قد يتولى المزود تحديثات البرمجيات، بينما يتحمل العميل إعدادات أمنية مثل التشفير."], ["For SaaS, who is responsible for application vulnerabilities according to the general model?", ["Customer", "Provider", "Internet service provider", "Hardware vendor"], 1, "في SaaS تكون ثغرات التطبيقات من مسؤولية المزود وفق شرح الملزمة."], ["For PaaS and IaaS, who secures customer applications against XSS or SQL injection?", ["Customer", "Cloud provider only", "Physical data center operator", "Community governance body"], 0, "في PaaS وIaaS يكون العميل مسؤولًا عن تأمين تطبيقاته ضد XSS وSQL injection."], ["Which layer's security is almost always the customer's responsibility?", ["Physical infrastructure", "Data access security", "Hypervisor security", "Provider network hardware"], 1, "أمن الوصول إلى البيانات يكون تقريبًا دائمًا مسؤولية العميل."], ["A customer misconfigures data access permissions and exposes stored data. Whose responsibility is this?", ["Provider physical security team", "Customer data access security responsibility", "Internet carrier network team", "Hardware manufacturer"], 1, "ضبط أذونات الوصول للبيانات مسؤولية العميل؛ وسوء ضبطها يقع ضمن مسؤوليته."], ["In AWS terminology, which distinction is correct?", ["AWS: security in the Cloud; customer: security of the Cloud", "AWS: security of the Cloud; customer: security in the Cloud", "Both only secure physical facilities", "Customer only handles billing"], 1, "AWS مسؤولة عن Security of the Cloud، والعميل عن Security in the Cloud."]], [["According to the introduction, which cloud feature can allow one user to misuse shared resources and harm co-located virtual machines?", ["Multi-tenancy", "Data deduplication", "Data minimization", "Auditing"], 0, "توضح المقدمة أن بيئة Multi-tenancy قد تسمح لمستخدم بإساءة استخدام الموارد المشتركة والإضرار بآلات افتراضية موجودة معه."], ["Which scenario is given as an example of an attacker accessing information shared between cloud users?", ["Changing a VM template locally", "Eavesdropping on network connections", "Deleting an audit report", "Increasing storage capacity"], 1, "المثال المذكور هو التنصت على اتصالات الشبكة للوصول إلى المعلومات المتبادلة بين المستخدمين."], ["What may happen if virtual storage volumes are not properly isolated?", ["Only the provider can access them", "Attackers may access other customers' data", "The SLA is automatically renewed", "Data deduplication stops"], 1, "عدم عزل وحدات التخزين الافتراضية بشكل صحيح قد يسمح للمهاجمين بالوصول إلى بيانات عملاء آخرين."], ["Which of the following is identified as a possible cloud infrastructure vulnerability in the introduction?", ["Insecure live migration of data", "Excessive screen brightness", "Slow keyboard response", "Unlicensed desktop themes"], 0, "تذكر المقدمة insecure live migration of data ضمن الثغرات المحتملة في البنية السحابية."], ["Why is it difficult to create one security model that covers all cloud possibilities?", ["Cloud services have no applications", "Threats and vulnerabilities exist across many infrastructure components", "Cloud providers do not use networks", "All cloud data is public"], 1, "تنتشر التهديدات والثغرات في طبقات ومكونات عديدة، من الخوادم ووحدات التحكم إلى Hypervisors وتطبيقات المستخدم."], ["According to the introduction, who is typically responsible for securing each layer of the cloud infrastructure?", ["Only the customer", "The cloud service provider", "The Internet user", "The hardware manufacturer"], 1, "تذكر الملزمة أن مزودي الخدمة عادةً لا يسمحون للعملاء بتطبيق نماذج أمنهم الخاصة على شبكة السحابة، وتقع مسؤولية تأمين طبقات البنية على المزود."], ["What is a limitation of security tools installed inside a customer's VM?", ["They cannot generate logs", "They may be subverte acy includes only network availability", "Security and privacy are identical terms", "Privacy concerns only physical servers"], 0, "الأمن أوسع ويشمل السرية والسلامة والتوافر، أما الخصوصية فتركز على قدرة الفرد على إبقاء معلوماته خاصة ومشاركتها مع أشخاص محددين."], ["Which security goal aims to keep data secret from unauthorized users?", ["Integrity", "Availability", "Confidentiality", "Auditing"], 2, "Confidentiality تعني إبقاء البيانات سرية ومنع وصول المستخدمين غير المصرح لهم إليها."], ["A cloud vendor uses encryption and isolation to protect sensitive stored data. Which security goal is primarily supported?", ["Confidentiality", "Availability", "Auditing", "Accountability"], 0, "التشفير والعزل من الآليات التي تستخدمها الجهات السحابية لتحقيق Confidentiality."], ["Which of the following is listed as a threat to confidentiality?", ["Malicious cloud provider users", "Redundant systems", "Fault-tolerant architecture", "Data backups"], 0, "من تهديدات السرية المذكورة: مستخدمو مزود السحابة الخبيثون، ومستخدمو الأطراف الثالثة، والهجمات الخارجية، وتسرب البيانات."], ["Which statement describes data integrity?", ["Data can be accessed from anywhere", "Data is not modified and remains accurate and of high quality", "Only authorized users can identify themselves", "Data is always stored in one country"], 1, "Integrity تضمن عدم تعديل البيانات بصورة غير مصرح بها، وأن تبقى دقيقة وذات جودة عالية."], ["Why is maintaining integrity more challenging in cloud environments than in centralized systems?", ["Cloud environments are distributed", "Cloud environments do not store data", "Cloud users never share resources", "Cloud providers cannot use encryption"], 0, "الملزمة تذكر أن الطبيعة الموزعة لبيئات السحابة تجعل الحفاظ على سلامة البيانات أكثر تحديًا من الأنظمة المركزية."], ["Which security goal ensures users can access cloud services and data anytime and from anywhere?", ["Confidentiality", "Integrity", "Availability", "Authorization"], 2, "Availability تضمن إمكانية وصول المستخدمين إلى ال const titles=["Week 1 — Cloud Computing Security","Week 2 — Cloud Security and Privacy","Week 3 — Cloud Platform and Infrastructure Security"];
let week=0,idx=0,answers=weeks.map(d=>Array(d.length).fill(null)),checked=weeks.map(d=>Array(d.length).fill(false));
function renderTabs(){let box=document.getElementById('tabs');box.innerHTML='';titles.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.className=i===week?'active':'';b.onclick=()=>{week=i;idx=0;document.getElementById('quiz').classList.remove('hidden');document.getElementById('result').classList.add('hidden');render()};box.appendChild(b)})}
function render(){renderTabs();let data=weeks[week],q=data[idx],a=answers[week][idx],c=checked[week][idx];
document.getElementById('qnum').textContent='Question '+(idx+1);document.getElementById('question').textContent=q[0];
document.getElementById('count').textContent='السؤال '+(idx+1)+' من '+data.length;
document.getElementById('answered').textContent='تمت الإجابة: '+answers[week].filter(x=>x!==null).length;
document.getElementById('bar').style.width=((idx+1)/data.length*100)+'%';
let box=document.getElementById('options');box.innerHTML='';
q[1].forEach((v,i)=>{let lab=document.createElement('label');lab.className='opt'+(a===i?' selected':'');
if(c)lab.className+=' '+(i===q[2]?'correct':(a===i?'wrong':''));
lab.textContent=String.fromCharCode(65+i)+'. '+v;lab.onclick=()=>{if(c)return;answers[week][idx]=i;render()};box.appendChild(lab)});
let fb=document.getElementById('feedback');if(c){fb.className='feedback show';fb.innerHTML='<div class="ar"><b>'+(a===q[2]?'إجابة صحيحة ✓':'إجابة غير صحيحة ✗')+'</b><br>'+q[3]+'</div>'}else{fb.className='feedback';fb.textContent=''}
document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===data.length-1?'إنهاء الاختبار':'التالي';
}
function move(d){let data=weeks[week];if(d===1&&!checked[week][idx]){if(answers[week][idx]===null){alert('اختر إجابة أولاً');return}checked[week][idx]=true;render();return}
if(d===1&&idx===data.length-1){finish();return}idx=Math.max(0,Math.min(data.length-1,idx+d));render()}
function clearChoice(){if(!checked[week][idx]){answers[week][idx]=null;render()}}
function finish(){let data=weeks[week],score=answers[week].reduce((s,a,i)=>s+(a===data[i][2]?1:0),0);
document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('score').textContent=score+' / '+data.length;document.getElementById('summary').textContent='النسبة: '+Math.round(score/data.length*100)+'%'}
function showReview(){let r=document.getElementById('review');r.innerHTML='';weeks[week].forEach((q,i)=>{let d=document.createElement('div');d.className='reviewitem';d.innerHTML='<b>Q'+(i+1)+'. '+q[0]+'</b><br>Your answer: '+(answers[week][i]===null?'لم تجب':q[1][answers[week][i]])+'<br>Correct answer: '+q[1][q[2]]+'<div class="ar">'+q[3]+'</div>';r.appendChild(d)})}
function restart(){idx=0;answers[week]=Array(weeks[week].length).fill(null);checked[week]=Array(weeks[week].length).fill(false);document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}
render();
</script></body></html>
